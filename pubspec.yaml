publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  archive: ^3.6.0
  xml: ^6.5.0
