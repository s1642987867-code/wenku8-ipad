name: wenku8_ipad
description: 轻小说文库 iPad 阅读器 — 发现/书架/本地书库/离线阅读/在线听书
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  flutter_tts: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Songti
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: Kaiti
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf