name: Build iPad IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Show tool versions
        run: |
          node --version
          flutter --version

      - name: Generate full catalog (4328 books from wenku8.net)
        run: |
          node tool/build_catalog.cjs

      - name: Verify assets
        run: |
          echo "=== GBK map ==="
          ls -la assets/gbk_map.bin
          echo "=== Catalog ==="
          ls -la assets/catalog/catalog.json
          echo "=== Catalog entry count ==="
          node -e "const c=require('./assets/catalog/catalog.json'); console.log('books:', c.length)"

      - name: Create iOS project files
        run: |
          flutter create --platforms=ios --org com.wenku8 --project-name wenku8 .

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned, no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          BUILD_DIR="build/ios/iphoneos"
          APP=$(find "$BUILD_DIR" -name "Runner.app" -maxdepth 1 | head -1)
          echo "Found app: $APP"

          rm -rf Payload
          mkdir Payload
          cp -r "$APP" Payload/

          zip -r -q wenku8.ipa Payload
          ls -la wenku8.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-ipa
          path: wenku8.ipa
          retention-days: 30
