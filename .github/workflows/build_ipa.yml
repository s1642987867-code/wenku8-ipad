name: Build Unsigned IPA

# 触发：手动触发，或 push 到 main 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macOS 云构建机（公开仓库免费；macos-14 已弃用）
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 iOS（未签名）
        run: flutter build ios --release --no-codesign

      - name: 组装未签名 ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry 轻小说文库.ipa Payload

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-ipa
          path: build/ios/ipa/轻小说文库.ipa
          retention-days: 30
